# ============================================================================
# DRAFT — manually tested once (2026-08-16, at the printer, purge
# position X150/Y225, ~140mm total in an 80mm+60mm split at F360) and it
# JAMMED partway through: flow stopped completely, the extruder motor
# audibly clicked/skipped (a stall against real resistance), caused by a
# small fragment of material stuck in the extruder - needed a manual
# push to clear. This is real, live confirmation of this file's own
# "no clog detection at all" warning below, not a theoretical concern.
# Klipper's own toolhead.stalls counter climbed steadily across that
# whole session (61->82->135) even before this specific jam - worth
# watching as an early warning sign, and worth adding a stalls-delta (or
# real MEASURING_WHEEL-based) check between cycles before trusting this
# macro unsupervised. Smaller cycles with pauses (instead of one or two
# big chunks) would also give more chances to catch a problem early.
# Still the least validated piece in this repo end-to-end. The
# purge-length constants and cycle-split model below are no longer
# arbitrary guesses — they're borrowed from
# https://github.com/gitstonelabs/creality-cfs-klipper, whose maintainer
# reverse-engineered the *compiled* stock box wrapper binary directly
# ("stock-capture decode 2026-06-30", wire-verified cycle-split examples
# like 158.75mm -> [80, 78.75]). That's a meaningfully stronger source
# than anything we derived ourselves for this specific piece.
#
# Independent cross-check: their FLUSH_TOTAL_DEFAULT (140mm) and
# FLUSH_VELOCITY_DEFAULT (360mm/min) match our own old box.cfg reference
# backup's tuned values (box_first/need_clean_length: 140, and a captured
# BOX_MATERIAL_FLUSH LEN=100 VELOCITY=360 example) — two unrelated sources
# agreeing on the same numbers is a real signal, not a coincidence.
#
# Formula (credit: gitstonelabs, wire-verified against real hardware):
#   total_purge_mm = nozzle_volume/2.4 + (5/12)*flush_volume_mm3*multiplier
#   nozzle_volume default 108mm^3, multiplier default 1.0
#   falls back to flush_default_len (140mm) if neither LEN= nor VOLUME= given
#   split into cycles: first cycle = cycle_cap (80mm default), remainder
#   split equally across ceil(remainder/cap) more cycles
#
# What we did NOT port, and why:
#   - The measuring-wheel clog/under-feed watchdog (compares purged length
#     against the box's measuring wheel delta each cycle, aborts on an
#     under-feed). This needs the MEASURING_WHEEL protocol command, which
#     we have the function code for (see cfs_protocol.py) but have never
#     actually sent or validated a response from. Porting the watchdog
#     logic without validating the underlying read first would just be
#     adding unearned confidence - noted as a real improvement opportunity,
#     not done here.
#   - The nozzle-clean-macro hook and buffer-gate logic around it.
# So: this purges the right AMOUNT (borrowed, well-grounded), but with NO
# clog detection at all (unlike the source project) - watch it.
#
# The cycle-split Jinja2 logic below was verified (outside Klipper, with
# plain jinja2) against all three of gitstonelabs' documented wire-verified
# breakdowns and reproduces them exactly: 158.75->[80,78.75],
# 343.33->[80,65.83 x4], 101.25->[80,21.25]. That confirms the ALGORITHM
# is ported correctly - it does not confirm anything about running on real
# Klipper or real hardware, which is still untested.
# ============================================================================

[gcode_macro CFS_FLUSH]
description: CFS_FLUSH [LEN=<mm>] [VOLUME=<mm3>] [VELOCITY=<mm/min>] [TEMP=<C>] - purge filament through the nozzle after a toolchange. DRAFT, no clog detection, supervised only.
variable_nozzle_volume: 108.0
variable_flush_multiplier: 1.0
variable_flush_default_len: 140.0
variable_flush_cycle_cap: 80.0
variable_flush_velocity: 360.0
variable_flush_total_max: 600.0
gcode:
    {% set explicit_len = params.LEN|default(0)|float %}
    {% set volume = params.VOLUME|default(0)|float %}
    {% set velocity = params.VELOCITY|default(flush_velocity)|float %}
    {% set temp = params.TEMP|default(0)|float %}

    {% if explicit_len > 0 %}
        {% set total = explicit_len %}
    {% elif volume > 0 %}
        {% set total = (nozzle_volume / 2.4) + ((5.0/12.0) * volume * flush_multiplier) %}
    {% else %}
        {% set total = flush_default_len %}
    {% endif %}

    {% if total > flush_total_max %}
        {action_raise_error("CFS_FLUSH: computed total %.1fmm exceeds the %.0fmm ceiling - check LEN=/VOLUME=" % (total, flush_total_max))}
    {% endif %}

    {% if temp > 0 %}
        M109 S{temp}
    {% endif %}
    {% if not printer.extruder.can_extrude %}
        {action_raise_error("CFS_FLUSH: hotend not hot enough to extrude - pass TEMP=... or heat manually first")}
    {% endif %}

    {# cycle split: first cycle = cap, remainder split equally - matches gitstonelabs' wire-verified model #}
    {% set cap = flush_cycle_cap %}
    {% if total <= cap %}
        {% set cycles = [total] %}
    {% else %}
        {% set rest = total - cap %}
        {% set n = (rest / cap)|round(0, 'ceil')|int %}
        {% set n = [n, 1]|max %}
        {% set cycles = [cap] + [rest / n] * n %}
    {% endif %}

    {action_respond_info("CFS_FLUSH: total %.2fmm in %d cycle(s) (cap %.0fmm) at F%.0f - no clog detection, watch it" % (total, cycles|length, cap, velocity))}

    M83
    {% for cyc in cycles %}
        G1 E{"%.3f" % cyc} F{velocity}
        M400
    {% endfor %}
    G91
    G1 E-1.5 F600
    G90
    M82
    {action_respond_info("CFS_FLUSH: done. Does not route into a purge tower/bucket, does not wipe the nozzle, does not check for clogs - see this file's header.")}
