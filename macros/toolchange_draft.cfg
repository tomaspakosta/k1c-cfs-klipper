# ============================================================================
# DRAFT — this macro has now been run for real, end to end, at least once
# (2026-08-16: CFS_TOOLCHANGE FROM=B TO=A) - see docs/TOOLCHANGE_TEST_PLAN.md
# phase 3 and FINDINGS.md for the full story. Two real things came out of
# that run:
#
# 1. A real code bug in this file, now fixed: the post-extrude "did the
#    toolhead sensor actually see filament" safety check used to be inline
#    in this macro's own gcode: block, which meant Klipper evaluated it -
#    and decided whether to save the new active slot - using STALE, PRE-
#    extrude sensor data, because Klipper renders a macro's whole Jinja2
#    template in one pass before any of its gcode lines actually run. See
#    the comment on the _CFS_TOOLCHANGE_FINISH macro below for the fix and
#    why splitting it into a separate macro call was the correct fix (not
#    a workaround) for this class of bug.
# 2. Not a code bug, a real mechanical one: even with the cut + tip-form
#    unload sequence, slot B jammed in the toolhead extruder's own drive
#    gear during this run and needed a manual lever release - matches
#    slot B's known history as the worst-behaved slot (see project memory/
#    FINDINGS.md). CFS_EXTRUDE afterward completed fine on its own. Do not
#    assume the retrude leg is hands-off yet, especially on slot B -
#    supervise closely and be ready to release the extruder idler lever by
#    hand if filament stops advancing.
#
# Do not load this and call it unsupervised. It's written directly from the
# phase 2 manual sequence in the test plan (cut -> retrude old -> extrude
# new).
#
# NOTE: earlier drafts of this macro did a manual toolhead pre-retract
# here before calling CFS_RETRUDE. That's now built into CFS_RETRUDE
# itself (klipper_extra/creality_cfs.py's tip-forming unload sequence -
# see FINDINGS.md in the private research log) and has been removed from
# here to avoid doing it twice.
#
# Requires klipper_extra/creality_cfs.py to already be installed and
# working (uses its CFS_RETRUDE / CFS_EXTRUDE gcode commands rather than
# re-implementing the serial calls here - keep one source of truth).
#
# Deliberately does ONE cut pass, not the multi-pass loop from
# cut_macro_draft.cfg / the external reference docs - per the test plan,
# start simple and only add retries if a single pass proves unreliable in
# practice on this hardware.
#
# Deliberately does NOT include purge/flush logic - that's now a separate
# macro, CFS_FLUSH, in flush_draft.cfg (much more speculative - see that
# file's header before using it).
#
# Example printer.cfg reuse of the confirmed cut position - adjust to your
# own measured coordinates, these are specific to our unit:
#   variable_cut_x / variable_cut_y below
#
# Requires a [save_variables] section in printer.cfg (any filename) so the
# active slot survives across macro calls:
#   [save_variables]
#   filename: ~/printer_data/config/cfs_variables.cfg
# ============================================================================

[gcode_macro CFS_TOOLCHANGE]
description: CFS_TOOLCHANGE FROM=<A|B|C|D> TO=<A|B|C|D> - swap active material. DRAFT, supervised testing only.
variable_cut_x: 36.0    ; re-calibrated 2026-08-16 - was 150.0/225.0 until
variable_cut_y: 227.0   ; further hardware handling shifted it; that old
                         ; position started hitting a nearby purge/wipe
                         ; flap instead of the cutter. Re-verify your own
                         ; coordinates any time you handle the printer -
                         ; see docs/PROTOCOL.md's cutter section.
variable_cut_z: 50.0    ; ADDED 2026-08-16 - this macro never set Z for the
                         ; cut move before, it just used whatever Z the
                         ; toolhead happened to already be at. Confirmed
                         ; live that this is not safe: at a low Z (~6mm,
                         ; right after a fresh G28) the cut move toward
                         ; X36/Y227 did NOT actually reach the real position
                         ; - Klipper's tracked position said it arrived, but
                         ; physically it didn't (lost steps against an
                         ; obstruction). A careful step-by-step live jog
                         ; found Z=50 cleanly reaches the cutter lever with
                         ; no collision - re-verify on your own printer,
                         ; don't assume this height transfers.
variable_retreat_x: 36.0
variable_retreat_y: 200.0
variable_cut_velocity: 20.0   ; mm/s - slow for first tests
gcode:
    {% set saved_slot = printer.save_variables.variables.cfs_active_slot|default('') %}
    {% set from_slot = params.FROM|default(saved_slot)|upper %}
    {% set to_slot = params.TO|upper %}
    {% if to_slot not in ['A', 'B', 'C', 'D'] %}
        {action_raise_error("CFS_TOOLCHANGE: TO must be one of A, B, C, D")}
    {% endif %}

    {% if from_slot == to_slot %}
        {action_respond_info("CFS_TOOLCHANGE: TO=%s is already the active slot (from saved state or explicit FROM), nothing to do" % to_slot)}
    {% else %}

    {% if not "xyz" in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90

    {% if from_slot in ['A', 'B', 'C', 'D'] %}
        {action_respond_info("CFS_TOOLCHANGE: cutting current material (%s)" % from_slot)}
        # Z-then-XY, not one diagonal move - see the variable_cut_z comment
        # above for why (a low/uncontrolled Z here caused a real lost-steps
        # failure to actually reach the cutter, 2026-08-16).
        G1 Z{cut_z} F{cut_velocity * 60}
        G4 P300
        G1 X{cut_x} Y{cut_y} F{cut_velocity * 60}
        G4 P300
        G1 X{retreat_x} Y{retreat_y} F{cut_velocity * 60}

        {action_respond_info("CFS_TOOLCHANGE: retruding old material (%s)" % from_slot)}
        CFS_RETRUDE SLOT={from_slot}
    {% else %}
        {action_respond_info("CFS_TOOLCHANGE: no FROM slot given, skipping cut/retrude")}
    {% endif %}

    {action_respond_info("CFS_TOOLCHANGE: extruding new material (%s)" % to_slot)}
    CFS_EXTRUDE SLOT={to_slot}
    _CFS_TOOLCHANGE_FINISH TO={to_slot}

    {% endif %}

# Internal helper, not meant to be called directly - see the comment at the
# call site above (right after CFS_EXTRUDE) for why this is a separate
# macro rather than inline code in CFS_TOOLCHANGE's own gcode: block.
#
# REAL BUG FOUND LIVE 2026-08-16 (see FINDINGS.md): Klipper renders an
# entire gcode_macro's Jinja2 template in ONE PASS before any of the
# resulting gcode lines actually execute - so a {% if %}/{action_respond_info}
# inside the SAME block as CFS_EXTRUDE evaluates using printer state from
# BEFORE CFS_EXTRUDE ran, not after. Confirmed live: CFS_TOOLCHANGE's old
# single-block version logged "complete, toolhead sensor confirms filament
# present, saved active slot=A" *within milliseconds* of the command being
# received - literally before the cut, retrude, or extrude had physically
# happened - because the whole template rendered eagerly up front. The
# save-state safety check was checking stale, pre-extrude sensor data, not
# the real post-extrude result.
#
# Splitting this check into its own separate gcode_macro fixes it: Klipper
# only renders THIS macro's template when the gcode processor actually
# reaches the `_CFS_TOOLCHANGE_FINISH` line above, which is genuinely after
# CFS_EXTRUDE has finished - so `printer[...]` here reflects real,
# post-extrude state. Any time you need a macro's later gcode.run_script
# calls to only be evaluated as their own step, split them out as a
# separate macro like this rather than relying on {% if %} in the same
# block to run "later" - it doesn't.
[gcode_macro _CFS_TOOLCHANGE_FINISH]
description: Internal - do not call directly, see comment above.
gcode:
    {% set to_slot = params.TO %}
    {% if not printer['filament_switch_sensor filament_sensor_2'].filament_detected %}
        {action_respond_info("CFS_TOOLCHANGE: WARNING - toolhead sensor does not see filament after extrude. Check manually before printing. NOT saving active-slot state, since this doesn't look like it actually succeeded.")}
    {% else %}
        SAVE_VARIABLE VARIABLE=cfs_active_slot VALUE='"{to_slot}"'
        {action_respond_info("CFS_TOOLCHANGE: complete, toolhead sensor confirms filament present, saved active slot=%s. No purge/flush done yet - see macros/flush_draft.cfg." % to_slot)}
    {% endif %}
