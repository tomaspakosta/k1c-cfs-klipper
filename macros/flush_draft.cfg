# ============================================================================
# DRAFT — the MOST speculative piece in this repo so far. Not tested, not
# even manually by hand the way the cut position and CFS_RETRUDE/EXTRUDE
# were before being written up. There is zero empirical data behind this
# specific macro beyond "the reference docs describe a printer-side
# extrusion + flush step existing at this point in the sequence."
#
# What this does: after a toolchange has gotten new material to the
# toolhead sensor (CFS_TOOLCHANGE), push a configurable length of filament
# through the hotend via the PRINTER's own extruder motor (not the CFS
# box) to purge the color-transition zone. That's the simplest possible
# interpretation of "flush" - it does NOT attempt to replicate any
# box-level flush protocol command, because we don't have one identified
# and validated (the old box.cfg reference for a *different*, officially-
# supported printer had a BOX_MATERIAL_FLUSH macro with LEN/VELOCITY/TEMP
# params, but we don't know if that's a distinct protocol command or just
# a wrapper around printer-side extrusion - untested either way here).
#
# Missing, deliberately, until there's a reason to add them:
#   - routing the purge into an actual purge tower / bucket position
#     (this just extrudes wherever the toolhead currently is)
#   - nozzle wipe/clean after flushing
#   - any box-level flush command, if one turns out to exist and matter
#
# Test this by itself, away from your model, before ever calling it as
# part of a real print. Watch it. Have a way to stop mid-extrusion.
# ============================================================================

[gcode_macro CFS_FLUSH]
description: CFS_FLUSH [LEN=<mm>] [TEMP=<C>] [VELOCITY=<mm/min>] - purge filament through the nozzle after a toolchange. DRAFT, least-tested piece in this repo, supervised only.
variable_default_len: 100.0
variable_default_velocity: 300.0
gcode:
    {% set len = params.LEN|default(default_len)|float %}
    {% set velocity = params.VELOCITY|default(default_velocity)|float %}
    {% set temp = params.TEMP|default(0)|float %}

    {% if temp > 0 %}
        {action_respond_info("CFS_FLUSH: heating to %.0fC before purging" % temp)}
        M109 S{temp}
    {% endif %}

    {% if not printer.extruder.can_extrude %}
        {action_raise_error("CFS_FLUSH: hotend not hot enough to extrude - pass TEMP=... or heat manually first")}
    {% endif %}

    {action_respond_info("CFS_FLUSH: purging %.1fmm at %.0fmm/min" % (len, velocity))}
    M83
    G1 E{len} F{velocity}
    M82
    {action_respond_info("CFS_FLUSH: done. This does not route into a purge tower/bucket or wipe the nozzle - see this file's header comment.")}
