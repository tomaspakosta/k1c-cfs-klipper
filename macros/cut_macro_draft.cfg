# ============================================================================
# DRAFT — NOT YET TESTED. Do not run unsupervised near the printer.
# Written 2026-08-14 based on confirmed-good coordinates from manual jog
# testing. UPDATED 2026-08-16: those original coordinates (X=150.0,
# Y=225.0) stopped being correct after further hardware handling - that
# position started hitting a nearby purge/wipe flap instead of the
# cutter. Re-calibrated the same way (manual jog, watch it happen, read
# back coordinates) to X=36.0, Y=227.0 - see docs/PROTOCOL.md's cutter
# section for the full story. **Don't treat a calibrated cut position as
# permanent** - re-verify after any physical handling of the printer.
# Staging position below is a guess carried over from the old layout
# (same offset pattern), not independently re-confirmed collision-free
# at the new coordinates - check it carefully before trusting it.
#
# Behavior modeled on FrederickAlt's unload-cutter-sensor-reference.md
# "blind-cut branch" (no separate cut-confirm switch known yet - only
# filament_sensor_2, which is the toolhead filament-presence sensor, not
# a cutter-return switch):
#   - only cut if local filament sensor sees filament (skip otherwise)
#   - retract a little first if the hotend can extrude
#   - do multiple press/retreat passes (CUT_RUN_COUNT), not just one
#   - always return to the safe staging position afterward
#   - temporarily raise acceleration during the cut moves, restore after
#
# TODO before trusting this beyond a single supervised test:
#   - confirm PRE_CUT position doesn't need press-avoidance in some other
#     axis (only X/Y checked so far, not sure Z matters at all here)
#   - confirm CUT_RUN_COUNT * pass actually improves cut reliability
#     vs. just doing it once - untested guess carried over from reference
#   - check if there's a genuine cut-confirm switch wired to another
#     nozzle_mcu pin we haven't identified yet, to replace the "blind"
#     assumption of success
# ============================================================================

[gcode_macro CFS_CUT_MATERIAL]
description: Cut filament at the CFS toolhead cutter lever. DRAFT - test supervised, small moves, low speed first.
variable_pre_cut_x: 36.0
variable_pre_cut_y: 200.0
variable_cut_x: 36.0
variable_cut_y: 227.0
variable_cut_run_count: 2
variable_cut_velocity: 20.0        ; mm/s - deliberately slow for first tests, speed up later once trusted
variable_cut_retract_len: 5.0      ; mm, small pre-cut retraction if hotend can extrude
gcode:
    {% if not printer['filament_switch_sensor filament_sensor_2'].filament_detected %}
        {action_respond_info("CFS_CUT_MATERIAL: no filament detected at toolhead sensor, skipping cut")}
    {% else %}
        {% set saved_accel = printer.toolhead.max_accel %}
        {% set saved_accel_to_decel = printer.toolhead.max_accel_to_decel %}

        {% if not "xyz" in printer.toolhead.homed_axes %}
            G28
        {% endif %}

        {% if printer.extruder.can_extrude %}
            M83                                          ; relative extrusion
            G1 E-{cut_retract_len} F300
        {% endif %}

        G90                                              ; absolute positioning - see docs/PROTOCOL.md G90/G91 gotcha
        SET_VELOCITY_LIMIT ACCEL=3000 ACCEL_TO_DECEL=3000 ; conservative, not copied from anywhere - tune later

        G1 X{pre_cut_x} Y{pre_cut_y} F{cut_velocity * 60}

        {% for i in range(cut_run_count) %}
            G1 X{cut_x} Y{cut_y} F{cut_velocity * 60}
            G4 P300                                       ; dwell, let the lever fully actuate
            G1 X{pre_cut_x} Y{pre_cut_y} F{cut_velocity * 60}
        {% endfor %}

        SET_VELOCITY_LIMIT ACCEL={saved_accel} ACCEL_TO_DECEL={saved_accel_to_decel}

        {% if printer.extruder.can_extrude %}
            G1 E{cut_retract_len} F300
            M82                                           ; back to absolute extrusion
        {% endif %}

        {action_respond_info("CFS_CUT_MATERIAL: cut sequence complete (blind - no cut-confirm switch wired yet, success is assumed not verified)")}
    {% endif %}
