# ============================================================================
# DRAFT — the individual pieces (cut, retrude with tip-forming unload,
# extrude with slot switching) are now all confirmed working by hand on
# real hardware, on all 4 slots - see docs/TOOLCHANGE_TEST_PLAN.md phase 2.
# This exact MACRO, as a single combined sequence, has NOT been run yet.
#
# Do not load this and call it unsupervised the first time. It's written
# directly from the phase 2 manual sequence in the test plan (cut ->
# retrude old -> extrude new), for use now that phase 2 has been proven
# working by hand, piece by piece.
#
# NOTE: earlier drafts of this macro did a manual toolhead pre-retract
# here before calling CFS_RETRUDE. That's now built into CFS_RETRUDE
# itself (klipper_extra/creality_cfs.py's tip-forming unload sequence -
# see FINDINGS.md in the private research log) and has been removed from
# here to avoid doing it twice.
#
# Requires klipper_extra/creality_cfs.py to already be installed and
# working (uses its CFS_RETRUDE / CFS_EXTRUDE gcode commands rather than
# re-implementing the serial calls here - keep one source of truth).
#
# Deliberately does ONE cut pass, not the multi-pass loop from
# cut_macro_draft.cfg / the external reference docs - per the test plan,
# start simple and only add retries if a single pass proves unreliable in
# practice on this hardware.
#
# Deliberately does NOT include purge/flush logic - that's now a separate
# macro, CFS_FLUSH, in flush_draft.cfg (much more speculative - see that
# file's header before using it).
#
# Example printer.cfg reuse of the confirmed cut position - adjust to your
# own measured coordinates, these are specific to our unit:
#   variable_cut_x / variable_cut_y below
#
# Requires a [save_variables] section in printer.cfg (any filename) so the
# active slot survives across macro calls:
#   [save_variables]
#   filename: ~/printer_data/config/cfs_variables.cfg
# ============================================================================

[gcode_macro CFS_TOOLCHANGE]
description: CFS_TOOLCHANGE FROM=<A|B|C|D> TO=<A|B|C|D> - swap active material. DRAFT, supervised testing only.
variable_cut_x: 36.0    ; re-calibrated 2026-08-16 - was 150.0/225.0 until
variable_cut_y: 227.0   ; further hardware handling shifted it; that old
                         ; position started hitting a nearby purge/wipe
                         ; flap instead of the cutter. Re-verify your own
                         ; coordinates any time you handle the printer -
                         ; see docs/PROTOCOL.md's cutter section.
variable_retreat_x: 36.0
variable_retreat_y: 200.0
variable_cut_velocity: 20.0   ; mm/s - slow for first tests
gcode:
    {% set saved_slot = printer.save_variables.variables.cfs_active_slot|default('') %}
    {% set from_slot = params.FROM|default(saved_slot)|upper %}
    {% set to_slot = params.TO|upper %}
    {% if to_slot not in ['A', 'B', 'C', 'D'] %}
        {action_raise_error("CFS_TOOLCHANGE: TO must be one of A, B, C, D")}
    {% endif %}

    {% if from_slot == to_slot %}
        {action_respond_info("CFS_TOOLCHANGE: TO=%s is already the active slot (from saved state or explicit FROM), nothing to do" % to_slot)}
    {% else %}

    {% if not "xyz" in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    G90

    {% if from_slot in ['A', 'B', 'C', 'D'] %}
        {action_respond_info("CFS_TOOLCHANGE: cutting current material (%s)" % from_slot)}
        G1 X{cut_x} Y{cut_y} F{cut_velocity * 60}
        G4 P300
        G1 X{retreat_x} Y{retreat_y} F{cut_velocity * 60}

        {action_respond_info("CFS_TOOLCHANGE: retruding old material (%s)" % from_slot)}
        CFS_RETRUDE SLOT={from_slot}
    {% else %}
        {action_respond_info("CFS_TOOLCHANGE: no FROM slot given, skipping cut/retrude")}
    {% endif %}

    {action_respond_info("CFS_TOOLCHANGE: extruding new material (%s)" % to_slot)}
    CFS_EXTRUDE SLOT={to_slot}

    {% if not printer['filament_switch_sensor filament_sensor_2'].filament_detected %}
        {action_respond_info("CFS_TOOLCHANGE: WARNING - toolhead sensor does not see filament after extrude. Check manually before printing. NOT saving active-slot state, since this doesn't look like it actually succeeded.")}
    {% else %}
        SAVE_VARIABLE VARIABLE=cfs_active_slot VALUE='"{to_slot}"'
        {action_respond_info("CFS_TOOLCHANGE: complete, toolhead sensor confirms filament present, saved active slot=%s. No purge/flush done yet - see macros/flush_draft.cfg." % to_slot)}
    {% endif %}

    {% endif %}{# from_slot == to_slot #}
