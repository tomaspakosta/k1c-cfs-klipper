# ============================================================================
# DRAFT — not tested. Aliases T0-T3 to CFS_TOOLCHANGE + CFS_FLUSH, so a
# slicer (or you, from the console) can call the standard tool-change
# gcode instead of the CFS_-prefixed macros directly.
#
# Mapping is T0->A, T1->B, T2->C, T3->D - this matches the sequential
# Orca-slot -> box-slot mapping noted from prior work on different CFS
# hardware (see docs/TOOLCHANGE_TEST_PLAN.md's slicer notes) - NOT
# independently verified on this project's own stack yet, since nothing
# has driven a real slicer print through this yet.
#
# Requires CFS_TOOLCHANGE (toolchange_draft.cfg) and CFS_FLUSH
# (flush_draft.cfg) already loaded.
#
# Do not point a slicer at these until you've called them by hand from
# the console first and confirmed the result, the same way everything
# else in this repo was validated.
# ============================================================================

[gcode_macro T0]
gcode:
    CFS_TOOLCHANGE TO=A
    CFS_FLUSH

[gcode_macro T1]
gcode:
    CFS_TOOLCHANGE TO=B
    CFS_FLUSH

[gcode_macro T2]
gcode:
    CFS_TOOLCHANGE TO=C
    CFS_FLUSH

[gcode_macro T3]
gcode:
    CFS_TOOLCHANGE TO=D
    CFS_FLUSH
